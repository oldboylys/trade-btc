# 策略选择与参数说明见 docs/strategies.md
mode: paper  # paper | testnet | live

strategy:
  default: btc_multi_indicator  # CLI 未指定 --strategy 时使用

exchanges:
  binance:
    enabled: true
    testnet: false
    ws_url: "wss://fstream.binance.com/ws"
    rest_url: "https://fapi.binance.com"
    rate_limit_per_minute: 1200
  hyperliquid:
    enabled: false
    ws_url: "wss://api.hyperliquid.xyz/ws"
    rest_url: "https://api.hyperliquid.xyz"
  aster:
    enabled: false
    ws_url: "wss://fapi.aster.finance/ws"
    rest_url: "https://fapi.aster.finance"

market_data:
  symbols: ["BTCUSDT"]
  intervals: ["1m", "5m", "15m", "1h"]
  db_path: "data/marketdata.db"

strategies:
  btc_multi_indicator:
    enabled: true
    symbol: "BTCUSDT"
    timeframe: "5m"
    trend_timeframe: "1h"
    max_position_usdt: 10000
    # Coolish 账本结论：约 60% 在 1h 趋势方向开仓；中位持仓 ~8.7h → 波段宽 TP/SL
    signal_threshold: 0.65       # 开仓得分阈值（提高选择性）
    reversal_threshold: 0.75     # 反手需更强反向信号，减少频繁翻转
    require_1h_trend: true       # 必须与 1h EMA 趋势同向（H1）
    tp_pct: 0.05                 # 止盈 5%（原 3%，适配波段）
    sl_pct: 0.025                # 止损 2.5%（原 1.5%，回撤期偏扛单）
    rsi_long_min: 45             # 盈利单开仓 RSI 中位 ~55
    rsi_long_max: 68
    rsi_short_min: 32
    rsi_short_max: 55
    rsi_1h_long_max: 72          # 1h RSI 过热时不追多（高 RSI 簇）
  # 日内取向：更多开单、更紧 TP/SL，详见 docs/strategies.md
  btc_multi_indicator_v2:
    enabled: false
    symbol: BTCUSDT
    timeframe: 5m
    trend_timeframe: 1h
    signal_threshold: 0.52       # 日内开仓得分阈值
    reversal_threshold: 0.62
    min_score_edge: 0.05         # 多空得分至少拉开 0.05
    require_1h_trend: false      # 不硬性要求 1h 同向
    require_5m_trend: true       # 5m EMA20/50 与方向一致
    use_1h_soft_filter: true     # 1h 逆势时需更高得分
    soft_1h_extra_threshold: 0.08
    trend_penalty_1h: 0.12       # 软过滤扣分（波段版硬过滤 -0.35）
    # --- 开仓 ---
    use_position_pct: true       # 按账户权益比例开仓（复利）
    position_pct: 0.30           # 每次名义 = 权益 × 30%
    max_position_usdt: 100000    # use_position_pct=false 时的固定名义上限
    # --- 止盈 / 止损（开仓时挂条件单，相对开仓价）---
    tp_pct: 0.015                # 止盈 1.5%
    sl_pct: 0.01                 # 初始止损 1%
    # --- 移动止损（持仓中向 TP 推进后递进抬止损，仅以下两档）---
    trail_stop_enabled: true
    trail_levels:
      - [0.50, 0.25]            # 推进至 entry→TP 的 50% 时，止损抬至 25% 处
      - [0.80, 0.40]            # 推进至 80% 时，止损抬至 40% 处
    rsi_oversold_max: 15         # 仅 RSI<=15 允许做多（超卖极端）
    rsi_overbought_min: 75       # 仅 RSI>=75 允许做空（超买极端）
    require_rsi_extreme: true
    vol_spike_ratio: 1.8         # 成交量/20均量 >= 此值视为放量
    vol_surge_mult: 1.25         # 相对上一根 5m 量能继续跳升
    vol_spike_score_bonus: 0.12  # 放量+极端 RSI 加分
    vol_spike_mid_rsi_penalty: 0.25
    require_vol_spike_for_entry: false
    rsi_1h_long_max: 78
  funding_arb:
    enabled: false
    min_funding_spread: 0.0002   # 最小套利价差 0.02%
    max_position_usdt: 5000
  volume_profile:
    enabled: false
    symbol: BTCUSDT
    timeframe: 5m
    trend_timeframe: 1h
    profile_timeframe: 5m
    lookback_bars: 288
    value_area_pct: 0.70
    bin_count: 50
    tick_size: 10
    entry_mode: val_poc_bounce   # val_poc_bounce | hvn_lvn_reversion
    require_trend_1h: true
    max_position_usdt: 10000
    tp_pct: 0.04
    sl_pct: 0.02
    min_distance_to_poc_pct: 0.003
  ict:
    enabled: false
    symbol: BTCUSDT
    timeframe: 5m
    structure_timeframe: 1h
    swing_lookback: 3
    displacement_atr_mult: 1.5
    fvg_min_gap_pct: 0.001
    ob_max_age_bars: 48
    liquidity_equal_threshold_pct: 0.0005
    require_premium_discount: true
    ote_low: 0.62
    ote_high: 0.79
    killzone_enabled: false
    killzone_utc: ["07:00-10:00", "13:00-16:00"]
    max_position_usdt: 10000
    tp_pct: 0.05
    sl_pct: 0.025
    signal_threshold: 0.6
    reversal_threshold: 0.75

risk:
  max_position_usdt: 20000
  max_single_order_usdt: 50000      # 支持 V2 30% 权益仓位（10万本金约 3万/笔）
  max_daily_loss_usdt: 1000
  max_consecutive_losses: 5
  price_deviation_pct: 0.05    # 行情异常保护 5%
  disconnect_reduce_only: true # 断线后只允许减仓

execution:
  order_timeout_s: 30
  max_retry: 3
  retry_delay_s: 1.0

logging:
  level: INFO
  file: "logs/trader.log"
  rotation: "1 day"

telegram:
  enabled: true          # false 则禁用通知
  bot_token: ""          # 填写于 secrets.local.yaml，禁止硬编码在此
  chat_id: ""            # 填写于 secrets.local.yaml，禁止硬编码在此
  hourly_interval_sec: 3600  # 持仓状态推送间隔（秒），启动后立即发第一条

web:
  host: "127.0.0.1"     # 改为 0.0.0.0 可局域网访问
  port: 8081

backtest:
  db_path: "data/marketdata.db"
  symbol: BTCUSDT
  start: "2024-06-01"
  end: null                        # null = 今天
  intervals: ["5m", "1h"]
  warmup_bars: 500
  initial_balance: 100000
